services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdocs-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-devdocs}
      POSTGRES_USER: ${DB_USERNAME:-devdocs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devdocs}
    ports:
      - "${DB_PORT:-5432}:5432"   # đổi DB_PORT trong .env nếu 5432 đã bị chiếm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devdocs} -d ${DB_NAME:-devdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: devdocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

volumes:
  pgdata:
  ollama:
