services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdocs-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-devdocs}
      POSTGRES_USER: ${DB_USERNAME:-devdocs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devdocs}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devdocs} -d ${DB_NAME:-devdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: devdocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment if you have an NVIDIA GPU + NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
