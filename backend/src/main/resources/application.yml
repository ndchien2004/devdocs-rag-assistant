spring:
  application:
    name: devdocs-rag-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/devdocs}
    username: ${DB_USERNAME:devdocs}
    password: ${DB_PASSWORD:devdocs}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true               # lỗi trả về theo RFC 9457
  http:
    clients:                      # RestClient gọi Ollama — hết thời gian → 503 thay vì treo request
      connect-timeout: 5s
      read-timeout: 180s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # never: pull model thủ công (docker exec ... ollama pull). when_missing: tự pull khi khởi động.
        pull-model-strategy: ${OLLAMA_PULL_STRATEGY:never}
        timeout: 30m
      chat:
        model: ${CHAT_MODEL:qwen2.5:7b}
        temperature: 0.2          # thấp để câu trả lời bám tài liệu, ít "sáng tạo"
        # Giới hạn token sinh ra. Mặc định Ollama không giới hạn: model nhỏ đôi khi lặp vô tận
        # (đã gặp thật: qwen2.5:3b sinh 38.000+ token cho một câu hỏi, request treo mãi).
        num-predict: 1024
      embedding:
        model: ${EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024          # phải bằng số chiều của embedding model (bge-m3 = 1024)

app:
  rag:
    top-k: 5
    similarity-threshold: 0.5
    max-context-tokens: 3000
    # Chọn theo Phase 4 (E1 + E4): chunk 150 token, overlap 60 (OverlapTextSplitter).
    # Baseline của đặc tả là chunk-size 500, chunk-overlap 0 (TokenTextSplitter).
    chunk-size: 150
    chunk-overlap: 60
    min-chunk-size-chars: 200
    min-chunk-length-to-embed: 10
    min-page-chars: 30
    max-file-size: 20MB
    storage-dir: ${STORAGE_DIR:./storage}
    eval-dataset: classpath:eval/eval-dataset.json

server:
  tomcat:
    # Mặc định Tomcat chỉ "nuốt" 2MB body thừa rồi đóng kết nối → client không nhận được 413.
    max-swallow-size: 50MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
